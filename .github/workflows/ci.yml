name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test
        run: uv run pytest -m "not slow and not network"

      - name: Re-score the committed study
        run: uv run pricedin evaluate studies/v1.toml --out runs/ci --bootstrap 200

  numbers:
    # Every published number is regenerated from the frozen data and compared with the commit.
    name: published numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Re-score study v1 in full and compare evaluation, report and summary
        run: uv run pricedin check studies/v1.toml

      - name: Rebuild the leakage check and the README result block
        run: |
          uv run python scripts/leakage_check.py
          uv run pricedin report studies/v1.toml --readme README.md
          git diff --exit-code -- README.md results/v1/leakage_check.json results/v1/report.md results/v1/summary.json
