[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pricedin"
version = "0.1.0"
description = "A leakage-safe baseline: does an LLM's own knowledge and reasoning, with no web research, add information to Kalshi and Polymarket prices?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "pricedin contributors" }]
keywords = [
    "llm", "forecasting", "prediction-markets", "kalshi", "polymarket", "calibration",
    "brier-score", "forecast-encompassing", "evaluation", "quant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
plot = ["matplotlib>=3.8"]
all = ["anthropic>=0.40", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/h-a-forster/pricedin"
Issues = "https://github.com/h-a-forster/pricedin/issues"
Changelog = "https://github.com/h-a-forster/pricedin/blob/main/CHANGELOG.md"

[project.scripts]
pricedin = "pricedin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pricedin"]

[tool.hatch.build.targets.sdist]
include = ["src/pricedin", "tests", "docs", "studies", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds",
    "network: needs internet access (deselected in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
